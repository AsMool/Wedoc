<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Galerie — Urbex</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="stylesheet" href="./css/gallery.css" />
</head>

<body class="bg-black text-white antialiased selection:bg-brandText/20 gallery">
  <header class="fixed top-4 right-4 z-50">
    <div class="flex items-center justify-end">
      <nav
        class="md:flex gap-4 rounded-full border border-brandStroke/60 bg-brandText/10 px-4 py-2 backdrop-blur-md transition-all duration-500 hover:border-2">
        <a href="index.html" class="px-4 py-1 rounded-full text-sm md:text-base hover:bg-brandText/20">Accueil</a>
        <a href="index.html#articles"
          class="px-4 py-1 rounded-full text-sm md:text-base hover:bg-brandText/20">Articles</a>
        <a href="index.html#images" class="px-4 py-1 rounded-full text-sm md:text-base hover:bg-brandText/20">Retour</a>
      </nav>
    </div>
  </header>

  <main class="pt-24 pb-24">
    <div class="container mx-auto px-6">
      <div class="mx-auto w-max rounded-full px-6 py-2 border border-brandStroke bg-black/20 text-brandText mb-10">
        Galerie</div>

      <div class="flex gap-4 mb-8">
        <button id="filter-all"
          class="filter-btn rounded-full px-4 py-2 border border-brandStroke bg-black/20 text-brandText">Toutes</button>
        <button id="filter-day"
          class="filter-btn rounded-full px-4 py-2 border border-brandStroke bg-black/20 text-brandText">Photos
          Jour</button>
        <button id="filter-night"
          class="filter-btn rounded-full px-4 py-2 border border-brandStroke bg-black/20 text-brandText">Photos
          Nuit</button>
      </div>

      <section id="gallery" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></section>

      <div id="gallery-empty" class="mt-8 opacity-60">Aucune photo trouvée dans les dossiers <code>img/photojours</code>
        ou <code>img/photonuit</code>. Déposez vos images et nommez-les comme <code>1.jpg</code>, <code>2.jpg</code>
        etc., ou modifiez la variable dans <code>gallery.js</code>.</div>
    </div>
  </main>

  <div id="image-modal" class="image-modal hidden">
    <div class="image-modal-overlay"></div>
    <div class="image-modal-content max-w-[1100px] w-full p-4">
      <button class="image-modal-close" aria-label="Fermer">✕</button>
      <div class="image-modal-image-wrapper">
        <img id="modal-image" src="" alt="" />
      </div>
      <div id="modal-caption" class="image-modal-caption"></div>
    </div>
  </div>


  <script src="./gallery-data.js"></script>
  <script src="./gallery.js" defer></script>
</body>

</html>
